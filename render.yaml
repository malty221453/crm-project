databases:
  - name: crm-db
    databaseName: crm_dashboard
    user: crmuser
    plan: free

services:
  - type: web
    name: crm-backend
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: WEBHOOK_SECRET
        value: change-me-in-production-123456
